<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShenPulse — Ouverture</title>
    <link rel="stylesheet" href="styles/startup-splash.css">
  </head>
  <body>
    <main class="startup-scene" aria-labelledby="startup-name">
      <div class="startup-grid" aria-hidden="true"></div>
      <div class="startup-orbit startup-orbit-cyan" aria-hidden="true"></div>
      <div class="startup-orbit startup-orbit-red" aria-hidden="true"></div>
      <div class="startup-axis" aria-hidden="true"></div>
      <div class="startup-brand">
        <p class="startup-eyebrow">VOTRE LIVE PREND VIE</p>
        <h1 id="startup-name"><img src="assets/brand/shenpulse-banner-transparent.png" width="1583" height="320" alt="ShenPulse" draggable="false"></h1>
        <p class="startup-tagline">STREAM <span>·</span> INTERACTIONS <span>·</span> ENSEMBLE</p>
        <svg class="startup-pulse" viewBox="0 0 540 64" fill="none" aria-hidden="true">
          <defs><linearGradient id="pulse-color"><stop stop-color="#00e4e8"></stop><stop offset=".45" stop-color="#00e4e8"></stop><stop offset=".55" stop-color="#ff4054"></stop><stop offset="1" stop-color="#ff4054"></stop></linearGradient></defs>
          <path class="startup-pulse-trail" d="M1 33H194L210 24L224 43L243 8L260 56L279 19L293 33H539"></path>
          <path class="startup-pulse-signal" d="M1 33H194L210 24L224 43L243 8L260 56L279 19L293 33H539" pathLength="100"></path>
        </svg>
        <p class="startup-status" role="status">Ouverture de votre studio<span aria-hidden="true">…</span></p>
      </div>
      <footer class="startup-footer" aria-hidden="true"><span>CRÉEZ. INTERAGISSEZ. DIFFUSEZ.</span><span class="startup-indicator"></span></footer>
    </main>
  </body>
</html>
