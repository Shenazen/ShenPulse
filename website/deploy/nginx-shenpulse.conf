# Vitrine ShenPulse générée en HTML ; les routes de service conservent le proxy.
server {
  listen 80;
  listen [::]:80;
  server_name shenpulse.leuridan.fr www.shenpulse.leuridan.fr;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name shenpulse.leuridan.fr www.shenpulse.leuridan.fr;
  ssl_certificate /etc/letsencrypt/live/shenpulse/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shenpulse/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  client_max_body_size 50m;
  add_header Strict-Transport-Security max-age=31536000 always;
  root /var/www/shenpulse/dist;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
  # API, OAuth, paiement, LIVE, WebSocket, fichiers d'installation et ressources
  # historiques : aucun changement d'hôte, de chemin, de corps ou de délai.
  location ~ ^/(?:api|ws|downloads|games|assets|sounds)(?:/|$)|^/agences/rejoindre$ {
    proxy_pass http://127.0.0.1:3199;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  location ~ /\.(?!well-known/) { return 404; }
  # Même traitement des fichiers publics et des documents pour le domaine canonique.
  location / {
    if ($host != www.shenpulse.leuridan.fr) { return 301 https://www.shenpulse.leuridan.fr$request_uri; }
    rewrite ^/index\.html$ / permanent;
    rewrite ^/(.+)/index\.html$ /$1 permanent;
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri/index.html $uri =404;
    error_page 404 /404.html;
    add_header Strict-Transport-Security max-age=31536000 always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
  }
  location = /404.html {
    internal;
    add_header Strict-Transport-Security max-age=31536000 always;
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Cache-Control "no-cache";
  }
  location /images/ {
    if ($host != www.shenpulse.leuridan.fr) { return 301 https://www.shenpulse.leuridan.fr$request_uri; }
    try_files $uri =404;
    add_header Strict-Transport-Security max-age=31536000 always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
