<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>ShenPulse</title><style>
:root{color-scheme:dark}body{font:12px system-ui;background:#242424;color:#eee;padding:14px;margin:0}h1{font-size:17px;margin:0 0 16px;color:#86deff}label{display:block;margin:12px 0 6px}input,select,button{box-sizing:border-box;width:100%;background:#363636;border:1px solid #545454;border-radius:5px;color:white;padding:9px}button{cursor:pointer;margin-top:12px;background:#195b76;border-color:#397a93}p{color:#aaa;line-height:1.5}#status{color:#b9e6fd;min-height:18px}#pairing{margin:14px 0;border-top:1px solid #444;padding-top:2px}
</style></head><body><h1>ShenPulse</h1><p>Choisissez la réaction de cette touche.</p><label for="target">Commande</label><select id="target"><option value="">Connectez ShenPulse pour choisir</option></select><button id="refresh" type="button">Actualiser les commandes</button><div id="pairing"><label for="endpoint">Adresse locale ShenPulse</label><input id="endpoint" value="http://127.0.0.1:21217"><label for="code">Code d’appairage</label><input id="code" placeholder="Code à 8 chiffres" maxlength="8" inputmode="numeric"><button id="pair" type="button">Appairer</button><p>Dans ShenPulse, ouvrez Contrôleurs → Appairer un appareil. Le code est valable 2 minutes.</p></div><p id="status" role="status"></p><script src="inspector.js"></script></body></html>
