<!doctype html>
<html lang="fr" class="overlay-booting">
  <head>
    <meta charset="UTF-8" />
    <script data-overlay-base-path>
      // Les alias HTTPS /m/... sont réécrits vers ce document : leurs assets
      // restent à la racine. Le serveur local conserve sa base /overlay/.
      if (location.protocol !== "file:" && !document.querySelector("base")) {
        const base = document.createElement("base");
        base.href = /^\/(?:overlay|match|match-bridge)(?:\/|$)/.test(location.pathname) ? "/overlay/" : "/";
        document.head.prepend(base);
      }
    </script>
    <meta name="shenpulse-overlay-version" content="2.0.4-overlay10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShenPulse Overlay</title>
    <link rel="preconnect" href="https://shenazenoverlay-default-rtdb.firebaseio.com" crossorigin />
    <link rel="dns-prefetch" href="//shenazenoverlay-default-rtdb.firebaseio.com" />
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2?v=2.0.4-overlay10" as="font" type="font/woff2" crossorigin />
    <script src="runtime/dependencies.js?v=2.0.4-overlay10"></script>
    <script src="runtime/match-local-entry.js?v=2.0.4-overlay10"></script>
    <link rel="stylesheet" href="styles/like-goal-layout.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/core.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/wheel.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/themes.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/configuration.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/timer-layout.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/timer.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/win-counter-layout.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/win-counter.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/leaderboard-layout.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/leaderboard.css?v=2.0.4-overlay10" />
    <link rel="stylesheet" href="styles/scene.css?v=2.0.4-overlay10" />
  </head>
  <body>
    <main id="overlay-root" aria-live="polite">
      <section id="alerts-view" class="view">
        <div id="alert-stage" class="alert-stage"></div>
      </section>

      <section id="my-actions-view" class="view">
        <div class="my-actions-shell">
          <header><span></span><strong id="my-actions-title">MY ACTIONS</strong></header>
          <div id="my-actions-stage" class="my-actions-stage"></div>
        </div>
      </section>

      <section id="goals-view" class="view">
        <div id="goals-stage" class="goals-stage"></div>
      </section>

      <section id="like-goal-view" class="view themed-view">
        <div class="themed-widget like-goal-widget">
          <img id="like-goal-frame" class="theme-frame" alt="" />
          <div class="like-goal-content">
            <strong id="like-goal-title"><span>LIKE GOAL</span></strong>
            <div class="like-goal-bar"><span id="like-goal-progress"></span></div>
            <small><span class="like-goal-values"><span id="like-goal-current">0</span> / <span id="like-goal-target">50 000</span> <span id="like-goal-progress-label">likes</span> <b id="like-goal-percent">0%</b></span></small>
          </div>
          <div class="like-goal-frame-foreground" aria-hidden="true">
            <img class="like-goal-frame-slice slice-top" alt="" />
            <img class="like-goal-frame-slice slice-right" alt="" />
            <img class="like-goal-frame-slice slice-bottom" alt="" />
            <img class="like-goal-frame-slice slice-left" alt="" />
          </div>
        </div>
      </section>

      <section id="feed-view" class="view">
        <div class="overlay-panel feed-panel">
          <header><span class="pulse-dot"></span><strong>LIVE PULSE</strong></header>
          <div id="feed-stage" class="feed-stage"></div>
        </div>
      </section>

      <section id="game-view" class="view">
        <div id="game-stage" class="game-stage"></div>
      </section>

      <section id="leaderboard-view" class="view themed-view">
        <div class="themed-widget leaderboard-widget">
          <img id="leaderboard-frame" class="theme-frame" alt="" />
          <div class="leaderboard-content">
            <header><span id="leaderboard-icon">♛</span><strong id="leaderboard-title"><span>CLASSEMENT DONATEURS</span></strong></header>
            <div id="leaderboard-rows"></div>
          </div>
        </div>
      </section>

      <section id="coin-jar-view" class="view">
        <div class="coin-jar-widget">
          <svg class="coin-jar-clip-definitions" aria-hidden="true">
            <defs>
              <clipPath id="coin-jar-glass-clip" clipPathUnits="objectBoundingBox">
                <path d="M .31 .09 L .69 .09 L .69 .17 C .75 .19 .785 .24 .785 .31 L .785 .80 C .785 .875 .75 .91 .66 .925 L .34 .925 C .25 .91 .215 .875 .215 .80 L .215 .31 C .215 .24 .25 .19 .31 .17 Z"></path>
              </clipPath>
              <clipPath id="coin-jar-motion-clip" clipPathUnits="objectBoundingBox">
                <path d="M .31 -.35 L .69 -.35 L .69 .17 C .75 .19 .785 .24 .785 .31 L .785 .80 C .785 .875 .75 .91 .66 .925 L .34 .925 C .25 .91 .215 .875 .215 .80 L .215 .31 C .215 .24 .25 .19 .31 .17 Z"></path>
              </clipPath>
            </defs>
          </svg>
          <img id="coin-jar-back" class="coin-jar-layer coin-jar-back" alt="" />
          <div class="coin-jar-level" aria-hidden="true"><span id="coin-jar-level"></span></div>
          <div id="coin-jar-drops" class="coin-jar-drops">
            <div id="coin-jar-contained-drops" class="coin-jar-drop-layer coin-jar-contained-drops"></div>
            <div id="coin-jar-overflow-drops" class="coin-jar-drop-layer coin-jar-overflow-drops"></div>
            <div id="coin-jar-exterior-drops" class="coin-jar-drop-layer coin-jar-exterior-drops"></div>
          </div>
          <img id="coin-jar-front" class="coin-jar-layer coin-jar-front" alt="" />
          <div class="coin-jar-meter">
            <span><strong id="coin-jar-current">0</strong> / <strong id="coin-jar-target">1 000</strong></span>
            <small>PIÈCES</small>
          </div>
        </div>
      </section>

      <section id="timer-view" class="view">
        <div class="overlay-panel timer-panel themed-widget">
          <img id="timer-frame" class="theme-frame" alt="" />
          <p id="timer-label"><span>TEMPS RESTANT</span></p>
          <strong id="timer-value" class="timer-value-zone"><span>00:00</span></strong>
        </div>
      </section>

      <section id="multiplier-timer-view" class="view">
        <div class="overlay-panel timer-panel multiplier-timer-panel themed-widget">
          <img id="multiplier-timer-frame" class="theme-frame" alt="" />
          <p id="multiplier-timer-label"><span>BONUS ACTIF</span></p>
          <div id="multiplier-timer-content" class="timer-value-zone">
            <span class="timer-value-content"><strong id="multiplier-timer-value">00:00</strong><b id="multiplier-value">X2</b></span>
          </div>
        </div>
      </section>

      <section id="win-counter-view" class="view themed-view">
        <div class="themed-widget win-counter-widget">
          <div class="win-counter-backdrop" aria-hidden="true"></div>
          <img id="win-counter-frame" class="theme-frame" alt="" />
          <div class="win-counter-content">
            <span id="win-counter-title"><span>WIN</span></span>
            <strong id="win-counter-value"><span>0</span></strong>
            <small id="win-counter-goal"><span>OBJECTIF <b id="win-counter-target">20</b></span></small>
          </div>
        </div>
      </section>

      <section id="wheel-view" class="view">
        <div id="wheel-stage" class="wheel-stage wheel-overlay wheel-overlay--source">
          <div class="wheel-presence">
            <div id="wheel-machine" class="wheel-machine">
              <div id="wheel-pointer" class="wheel-pointer wheel-pointer--top"><span></span></div>
              <div id="wheel-frame" class="wheel-frame">
                <span class="royal-ornament royal-ornament--top"><i></i></span>
                <span class="royal-ornament royal-ornament--right"><i></i></span>
                <span class="royal-ornament royal-ornament--bottom"><i></i></span>
                <span class="royal-ornament royal-ornament--left"><i></i></span>
                <div class="wheel-disc" id="wheel"></div>
                <div class="wheel-cap" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="8" width="18" height="13" rx="2"></rect>
                    <path d="M12 8v13M3 12h18M7.5 8C5 8 4.5 4.5 7 4.5c3 0 5 3.5 5 3.5s2-3.5 5-3.5c2.5 0 2 3.5-.5 3.5"></path>
                  </svg>
                </div>
              </div>
              <div id="wheel-stand" class="wheel-stand"><span></span></div>
            </div>
            <strong id="wheel-caption">ROUE DES ACTIONS</strong>
            <strong id="wheel-winner"></strong>
          </div>
        </div>
      </section>

      <section id="scene-view" class="view"><div id="scene-canvas"></div></section>
      <section id="match-widget-view" class="view"><div id="match-widget-stage" hidden></div></section>
      <section id="match-view" class="view">
        <div class="match-stage">
          <video id="match-video" muted playsinline preload="auto"></video>
          <div class="match-fallback"><span>VS</span><strong id="match-title">MATCH</strong></div>
        </div>
      </section>
    </main>
    <script src="runtime/loader.js?v=2.0.4-overlay10"></script>
  </body>
</html>
